<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-language" content="pl" />
    <title data-i18n="auth.login.meta">Zaloguj · LogisPass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://analityka.dcsandbox.dev/script.js"
      data-website-id="cb85f5da-4233-4fed-8d88-ee3085c38281"
    ></script>
  </head>
  <body class="auth-body">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/">LogisPass</a>
      <div class="header-tools">
        <nav data-auth-nav aria-label="Konto"></nav>
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Język">
          <button type="button" class="lang-btn" data-lang="pl" aria-pressed="false">PL</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="auth-page">
      <section class="panel auth-panel">
        <h1 data-i18n="auth.login.title">Zaloguj</h1>
        <p class="muted" data-i18n="auth.login.lede">Zaloguj się do studio LogisPass.</p>
        <form id="login-form" class="auth-form">
          <label>
            <span data-i18n="auth.email">E-mail</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            <span data-i18n="auth.password">Hasło</span>
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p class="error" id="login-error" hidden></p>
          <button type="submit" class="btn primary" id="login-submit" data-i18n="auth.login.submit">
            Zaloguj
          </button>
        </form>
        <p class="muted auth-switch">
          <a href="/przypomnij-haslo" data-i18n="auth.forgotLink">Nie pamiętasz hasła?</a>
        </p>
        <p class="muted auth-switch">
          <span data-i18n="auth.noAccount">Nie masz konta?</span>
          <a href="/zarejestruj" data-i18n="nav.register">Zarejestruj</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-credit">
        logisPass - produkt rozwijany i utrzymywany przez
        <a href="https://logistos.pl" target="_blank" rel="noopener noreferrer">LOGISTOS</a>
      </p>
    </footer>

    <script type="module">
      import { initI18n, t, applyDomTranslations } from "./i18n.js";
      import { authApi, bindAuthHeader, fetchMe } from "./auth.js";

      initI18n();
      const me = await fetchMe();
      if (me) {
        window.location.replace("/");
      } else {
        await bindAuthHeader();
        applyDomTranslations(document);
      }

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const submitBtn = document.getElementById("login-submit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = t("auth.login.busy");
        const fd = new FormData(form);
        try {
          await authApi("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              email: fd.get("email"),
              password: fd.get("password"),
            }),
          });
          window.location.href = "/";
        } catch (err) {
          errorEl.hidden = false;
          errorEl.textContent = err instanceof Error ? err.message : t("auth.login.failed");
          submitBtn.disabled = false;
          submitBtn.textContent = t("auth.login.submit");
        }
      });
    </script>
  </body>
</html>
