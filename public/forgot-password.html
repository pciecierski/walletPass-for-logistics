<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-language" content="pl" />
    <title data-i18n="auth.forgot.meta">Reset hasła · LogisPass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://analityka.dcsandbox.dev/script.js"
      data-website-id="cb85f5da-4233-4fed-8d88-ee3085c38281"
    ></script>
  </head>
  <body class="auth-body">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/">LogisPass</a>
      <div class="header-tools">
        <nav data-auth-nav aria-label="Konto"></nav>
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Język">
          <button type="button" class="lang-btn" data-lang="pl" aria-pressed="false">PL</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="auth-page">
      <section class="panel auth-panel">
        <h1 data-i18n="auth.forgot.title">Reset hasła</h1>
        <p class="muted" data-i18n="auth.forgot.lede">
          Podaj e-mail konta — wyślemy jednorazowy link do ustawienia nowego hasła (SendGrid).
        </p>
        <div id="forgot-done" hidden>
          <p class="muted" id="forgot-message"></p>
          <p class="error" id="forgot-email-err" hidden></p>
          <p class="muted" id="forgot-preview" hidden></p>
          <p class="muted auth-switch">
            <a href="/zaloguj" data-i18n="auth.backLogin">Wróć do logowania</a>
          </p>
        </div>
        <form id="forgot-form" class="auth-form">
          <label>
            <span data-i18n="auth.email">E-mail</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <p class="error" id="forgot-error" hidden></p>
          <button type="submit" class="btn primary" id="forgot-submit" data-i18n="auth.forgot.submit">
            Wyślij link resetu
          </button>
        </form>
        <p class="muted auth-switch" id="forgot-switch">
          <a href="/zaloguj" data-i18n="auth.backLogin">Wróć do logowania</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-credit">
        logisPass - produkt rozwijany i utrzymywany przez
        <a href="https://logistos.pl" target="_blank" rel="noopener noreferrer">LOGISTOS</a>
      </p>
    </footer>

    <script type="module">
      import { initI18n, t, applyDomTranslations } from "./i18n.js";
      import { authApi, bindAuthHeader } from "./auth.js";

      initI18n();
      await bindAuthHeader();
      applyDomTranslations(document);

      const form = document.getElementById("forgot-form");
      const done = document.getElementById("forgot-done");
      const errorEl = document.getElementById("forgot-error");
      const submitBtn = document.getElementById("forgot-submit");
      const switchEl = document.getElementById("forgot-switch");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = t("auth.forgot.busy");
        const fd = new FormData(form);
        try {
          const res = await authApi("/api/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: fd.get("email") }),
          });
          form.hidden = true;
          switchEl.hidden = true;
          done.hidden = false;
          document.getElementById("forgot-message").textContent = res.message;
          const err = document.getElementById("forgot-email-err");
          const preview = document.getElementById("forgot-preview");
          if (res.emailError) {
            err.hidden = false;
            err.textContent = res.emailError;
          }
          if (res.previewSetupUrl) {
            preview.hidden = false;
            preview.innerHTML = `${t("auth.forgot.preview")} <a href="${res.previewSetupUrl}">${res.previewSetupUrl}</a>`;
          }
        } catch (err) {
          errorEl.hidden = false;
          errorEl.textContent = err instanceof Error ? err.message : t("auth.forgot.failed");
          submitBtn.disabled = false;
          submitBtn.textContent = t("auth.forgot.submit");
        }
      });
    </script>
  </body>
</html>
