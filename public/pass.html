<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-language" content="pl" />
    <meta name="language" content="Polish" />
    <title data-i18n="pass.meta.title">Twoja przepustka · LogisPass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://analityka.dcsandbox.dev/script.js"
      data-website-id="cb85f5da-4233-4fed-8d88-ee3085c38281"
    ></script>
  </head>
  <body class="pass-page">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/">LogisPass</a>
      <div class="header-tools">
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Język">
          <button type="button" class="lang-btn" data-lang="pl" aria-pressed="false">PL</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>
    <main class="pass-main">
      <p class="brand-mark">LogisPass</p>
      <h1 id="pass-title" data-i18n="pass.loading">Ładowanie przepustki…</h1>
      <p class="lede" id="pass-desc"></p>
      <div class="pass-preview" id="pass-preview"></div>
      <div class="cta-row" id="pass-actions"></div>
      <p class="muted" id="pass-meta"></p>
    </main>
    <footer class="site-footer">
      <p class="footer-credit">
        logisPass - produkt rozwijany i utrzymywany przez
        <a href="https://logistos.pl" target="_blank" rel="noopener noreferrer">LOGISTOS</a>
      </p>
    </footer>
    <script type="module" src="/pass-page.js"></script>
  </body>
</html>
