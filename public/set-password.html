<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-language" content="pl" />
    <title data-i18n="auth.setPassword.meta">Ustaw hasło · WalletPass for Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://analityka.dcsandbox.dev/script.js"
      data-website-id="cb85f5da-4233-4fed-8d88-ee3085c38281"
    ></script>
  </head>
  <body class="auth-body">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="/">WalletPass for Logistics</a>
      <div class="header-tools">
        <nav data-auth-nav aria-label="Konto"></nav>
        <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Język">
          <button type="button" class="lang-btn" data-lang="pl" aria-pressed="false">PL</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="auth-page">
      <section class="panel auth-panel">
        <h1 id="set-title" data-i18n="auth.setPassword.title">Ustaw hasło</h1>
        <p class="muted" id="set-loading" data-i18n="auth.setPassword.checking">Sprawdzanie linku…</p>
        <div id="set-form-wrap" hidden>
          <p class="muted" id="set-lede"></p>
          <form id="set-form" class="auth-form">
            <label>
              <span id="set-password-label" data-i18n="auth.password">Hasło</span>
              <input
                name="password"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </label>
            <label>
              <span data-i18n="auth.passwordRepeat">Powtórz hasło</span>
              <input
                name="password2"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </label>
            <p class="error" id="set-error" hidden></p>
            <button type="submit" class="btn primary" id="set-submit" data-i18n="auth.setPassword.submit">
              Zapisz hasło i zaloguj
            </button>
          </form>
        </div>
        <div id="set-invalid" hidden>
          <p class="error" id="set-invalid-msg" data-i18n="auth.setPassword.invalid">
            Link jest nieprawidłowy lub wygasł
          </p>
          <p class="muted auth-switch">
            <a href="/przypomnij-haslo" data-i18n="auth.forgotLink">Nie pamiętasz hasła?</a>
            ·
            <a href="/zaloguj" data-i18n="nav.login">Zaloguj</a>
          </p>
        </div>
      </section>
    </main>

    <script type="module">
      import { initI18n, t, applyDomTranslations } from "./i18n.js";
      import { authApi, bindAuthHeader } from "./auth.js";

      initI18n();
      await bindAuthHeader();
      applyDomTranslations(document);

      const token = window.location.pathname.split("/").filter(Boolean).pop();
      const loading = document.getElementById("set-loading");
      const formWrap = document.getElementById("set-form-wrap");
      const invalid = document.getElementById("set-invalid");
      const errorEl = document.getElementById("set-error");
      const submitBtn = document.getElementById("set-submit");
      const title = document.getElementById("set-title");
      const lede = document.getElementById("set-lede");
      const passwordLabel = document.getElementById("set-password-label");

      /** @type {{ email: string, firstName: string, locationName: string, mode: 'setup' | 'reset' } | null} */
      let meta = null;

      try {
        if (!token) throw new Error(t("auth.setPassword.invalid"));
        meta = await authApi(`/api/auth/password-setup/${encodeURIComponent(token)}`);
        loading.hidden = true;
        formWrap.hidden = false;
        const isReset = meta.mode === "reset";
        title.textContent = isReset ? t("auth.setPassword.titleReset") : t("auth.setPassword.title");
        passwordLabel.textContent = isReset ? t("auth.passwordNew") : t("auth.password");
        lede.replaceChildren();
        lede.append(
          document.createTextNode(
            isReset
              ? t("auth.setPassword.ledeResetPrefix", { name: meta.firstName })
              : t("auth.setPassword.ledeSetupPrefix", { name: meta.firstName }),
          ),
        );
        const strong = document.createElement("strong");
        strong.textContent = meta.locationName;
        lede.append(strong);
        lede.append(
          document.createTextNode(
            t("auth.setPassword.ledeSuffix", { email: meta.email }),
          ),
        );
        submitBtn.textContent = isReset
          ? t("auth.setPassword.submitReset")
          : t("auth.setPassword.submit");
      } catch (err) {
        loading.hidden = true;
        invalid.hidden = false;
        const msg = document.getElementById("set-invalid-msg");
        msg.textContent = err instanceof Error ? err.message : t("auth.setPassword.invalid");
      }

      document.getElementById("set-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const password = String(fd.get("password") || "");
        const password2 = String(fd.get("password2") || "");
        errorEl.hidden = true;
        if (password !== password2) {
          errorEl.hidden = false;
          errorEl.textContent = t("auth.passwordMismatch");
          return;
        }
        if (password.length < 8) {
          errorEl.hidden = false;
          errorEl.textContent = t("auth.passwordShort");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = t("auth.setPassword.busy");
        try {
          await authApi(`/api/auth/password-setup/${encodeURIComponent(token)}`, {
            method: "POST",
            body: JSON.stringify({ password }),
          });
          window.location.href = "/";
        } catch (err) {
          errorEl.hidden = false;
          errorEl.textContent =
            err instanceof Error ? err.message : t("auth.setPassword.failed");
          submitBtn.disabled = false;
          submitBtn.textContent =
            meta?.mode === "reset"
              ? t("auth.setPassword.submitReset")
              : t("auth.setPassword.submit");
        }
      });
    </script>
  </body>
</html>
